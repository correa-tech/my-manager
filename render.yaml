services:
  - type: web
    name: gestao-pessoal
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestao-pessoal-db
          property: connectionString

databases:
  - name: gestao-pessoal-db